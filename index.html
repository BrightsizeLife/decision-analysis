<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A workbench for Bayesian decision analysis: enumerate decisions and outcomes, model p(x|d), define utility, and maximize expected utility — after Gelman et al., BDA chapter 9."
    />
    <title>Decision Workbench</title>
    <script>
      // Apply an explicit theme choice before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('dw:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
